[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loomground-workspace"
version = "0.1.0"
description = "What a workspace is: how it is scoped, identified and registered — independent of any engine that governs one."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "flxk1" }]
keywords = ["workspace", "folder-identity", "scope", "registry"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loomground_workspace = ["py.typed"]
